<ion-content [fullscreen]="true" class="home-content">
  <div class="home-container">
    <header class="home-header">
      <img src="assets/icon/logo.png" alt="" class="home-logo" />
      <div>
        <h1>ELVA Gestión</h1>
        <p>¿Qué desea hacer hoy?</p>
      </div>
    </header>

    <nav class="options" aria-label="Menú principal">
      @for (option of options; track option.title) { @if (option.route) {
      <a class="option" [routerLink]="option.route">
        <ion-icon [name]="option.icon" aria-hidden="true"></ion-icon>
        <span class="option-text">
          <strong>{{ option.title }}</strong>
          <span>{{ option.description }}</span>
        </span>
        <ion-icon name="chevron-forward-outline" aria-hidden="true" class="chevron"></ion-icon>
      </a>
      } @else {
      <div class="option disabled" aria-disabled="true">
        <ion-icon [name]="option.icon" aria-hidden="true"></ion-icon>
        <span class="option-text">
          <strong>{{ option.title }}</strong>
          <span>{{ option.description }}</span>
        </span>
        <span class="badge">Próximamente</span>
      </div>
      } }
    </nav>
  </div>
</ion-content>
